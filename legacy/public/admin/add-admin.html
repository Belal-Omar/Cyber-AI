<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Admin | Sential AI</title>

  <link rel="stylesheet" href="/admin/css/style.css">
  <link rel="stylesheet" href="/admin/css/dashboard.css">
</head>

<body class="sential-dashboard">

  <header class="sential-topbar">
    <a href="/admin/dashboard" class="brand-container">
      <div class="brand-mark">🛡️</div>
      <div>
        <div class="brand-name">
          Sential <span class="brand-ai">AI</span>
        </div>
        <div class="brand-tagline">Autonomous Security</div>
      </div>
    </a>

    <a href="/admin/dashboard" class="dashboard-btn">
      Back to Dashboard
    </a>
  </header>

  <main class="dashboard-content-area">

    <div class="dash-heading">
      <div>
        <span class="eyebrow">ADMINISTRATION / USERS</span>
        <h1 class="dash-title" style="margin-top: 8px">
          Add New Admin
        </h1>
        <p class="dash-subtitle">
          Create a new administrator account.
        </p>
      </div>
    </div>

    <section class="sential-card">
      <div class="sential-card-head">
        <h2 class="sential-card-title">Administrator Details</h2>
      </div>

      <form id="addAdminForm" class="dashboard-form">

        <div class="field">
          <label class="field-label" for="adminFullName">
            Full Name
          </label>
          <input id="adminFullName" name="name" type="text"
            placeholder="Enter full name" required>
        </div>

        <div class="field">
          <label class="field-label" for="adminEmail">
            Email Address
          </label>
          <input id="adminEmail" name="email" type="email"
            placeholder="admin@example.com" required>
        </div>

        <div class="field">
          <label class="field-label" for="adminPassword">
            Password
          </label>
          <input id="adminPassword" name="password" type="password"
            placeholder="At least 8 characters"
            minlength="8" required>
        </div>

        <div class="field">
          <label class="field-label" for="adminConfirmPassword">
            Confirm Password
          </label>
          <input id="adminConfirmPassword" name="confirmPassword"
            type="password" placeholder="Repeat password"
            minlength="8" required>
        </div>

        <div class="dashboard-form-actions">
          <button type="submit" class="dashboard-btn primary">
            Create Admin
          </button>

          <button type="reset" class="dashboard-btn">
            Clear Form
          </button>
        </div>

        <p id="addAdminMessage" role="status"
          style="grid-column: 1 / -1"></p>

      </form>
    </section>

  </main>

  <script src="/admin/js/add-admin.js"></script>
</body>
</html>
